    <!-- The 3D CSS Split Image Technique -->
    <div class="butterfly-follower" id="butterfly">
        <div class="butterfly-body-container">
            <!-- Left Wing Cutout from user image -->
            <img src="BUTTERFLY.png" alt="Left Wing" class="butterfly-wing left-wing">

    <!-- Realistic 3D Physics and Animation Engine -->
    <script>
        const butterfly = document.getElementById('butterfly');
        
        let targetX = window.innerWidth / 2;
        let targetY = window.innerHeight / 2;
        let currentX = window.innerWidth / 2;
        let currentY = window.innerHeight / 2;
        let currentAngle = 0;
        let time = 0;

        document.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
        });

        // Smooth angular interpolation to prevent snapping
        function lerpAngle(a, b, t) {
            let delta = ((b - a + 540) % 360) - 180;
            return a + delta * t;
        }

        function animateButterfly() {
            time += 0.05;
            
            // 1. Organic Bobbing & Wandering
            let wanderX = Math.sin(time * 1.2) * 12;
            let wanderY = Math.cos(time * 1.5) * 12;

            // 2. Smooth Interpolation (Lerp)
            let dx = (targetX + wanderX) - currentX;
            let dy = (targetY + wanderY) - currentY;
            
            currentX += dx * 0.05;
            currentY += dy * 0.05;

            // 3. Velocity Calculation
            let velocity = Math.sqrt(dx * dx + dy * dy);

            // 4. Calculate Intended Flight Direction
            let targetAngle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
            
            // Only update rotation if it's actually moving to prevent twitching when stopped
            if (velocity > 1) {
                currentAngle = lerpAngle(currentAngle, targetAngle, 0.08);
            }

            // 5. Aerodynamic Banking (Roll)
            // Butterfly leans into turns. We calculate the difference between where it's facing and where it wants to go.
            let angleDiff = ((targetAngle - currentAngle + 540) % 360) - 180;
            let bankY = angleDiff * 0.6; // Multiply for effect intensity
            
            // Clamp the bank angle to prevent it from flipping entirely upside down
            bankY = Math.max(-50, Math.min(50, bankY));

            // 6. Altitude Breathing (Z-Axis Scale)
            let altitudeScale = 1 + Math.sin(time * 2.5) * 0.08;

            // Apply global positioning, direction (Z), banking (Y), and altitude scale
            butterfly.style.transform = `translate(${currentX}px, ${currentY}px) scale(${altitudeScale}) rotateZ(${currentAngle}deg) rotateY(${bankY}deg)`;

            // 7. Dynamic Flap Speed
            let flapSpeed = Math.max(0.08, 0.35 - (velocity * 0.015));
            document.documentElement.style.setProperty('--flap-speed', flapSpeed + 's');

            requestAnimationFrame(animateButterfly);
        }
        
        animateButterfly();
    </script>
