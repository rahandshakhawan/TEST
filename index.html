    <!-- Hand-Coded SVG Butterfly Replica (3D Perspective) -->

    <!-- The Master Engine: Unified Physics Loop -->
    <script>
        // --- 1. GLOBALS & STATE ---
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let isTouch = false;

        // Butterfly State
        const butterfly = document.getElementById('butterfly');
        let bfX = window.innerWidth / 2, bfY = window.innerHeight / 2;
        let bfAngle = 0, bfPitchX = 0, bfBankY = 0;
        let lastFlapState = 'hover';
        let time = 0;

        // Parallax State
        const monolith = document.getElementById('monolith');
        const glare = document.getElementById('glare');
        let currentTiltX = 0, currentTiltY = 0;

        // --- 2. INPUT LISTENERS ---
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            isTouch = false;
        });

        document.addEventListener('touchmove', (e) => {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
            isTouch = true;
        }, { passive: true });

        document.addEventListener('touchstart', (e) => {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
            isTouch = true;
        }, { passive: true });

        // --- 3. MAGNETIC BUTTON PHYSICS ---
        const magneticWraps = document.querySelectorAll('.magnetic-wrap');
        magneticWraps.forEach(wrap => {
            const target = wrap.querySelector('.magnetic-target');
            
            wrap.addEventListener('mousemove', (e) => {
                if(isTouch) return; // Disable on mobile
                const rect = wrap.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                
                // Pull the button towards the cursor (strength: 0.3)
                target.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px) scale(1.02)`;
                target.style.borderColor = 'var(--green)';
            });

            wrap.addEventListener('mouseleave', () => {
                target.style.transform = `translate(0px, 0px) scale(1)`;
                target.style.borderColor = '';
            });
        });

        // --- 4. PARTICLE CANVAS ENGINE ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = Math.random() * 0.5 + 0.2;
                this.color = Math.random() > 0.5 ? '#FFF2CE' : '#54BBB8';
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }

                // Interaction with Butterfly Wake
                let dx = this.x - bfX;
                let dy = this.y - bfY;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 100) {
                    let force = (100 - distance) / 100;
                    this.x += (dx / distance) * force * 2;
                    this.y += (dy / distance) * force * 2;
                }
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            }
        }

        // Initialize 70 particles
        for(let i=0; i<70; i++) particles.push(new Particle());

        // --- 5. MATH UTILS ---
        function lerpAngle(a, b, t) {
            let delta = ((b - a + 540) % 360) - 180;
            return a + delta * t;
        }

        // --- 6. THE UNIFIED RENDER LOOP ---
        function render() {
            time += 0.05;
            
            // --- A. Canvas Draw ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });

            // --- B. Monolith Parallax ---
            if (!isTouch) {
                // Calculate normalized mouse position (-1 to 1)
                let normX = (mouseX / window.innerWidth) * 2 - 1;
                let normY = (mouseY / window.innerHeight) * 2 - 1;

                // Target tilt (max 4 degrees)
                let targetTiltX = normY * -4;
                let targetTiltY = normX * 4;

                // Smooth Parallax Lerp
                currentTiltX += (targetTiltX - currentTiltX) * 0.05;
                currentTiltY += (targetTiltY - currentTiltY) * 0.05;

                monolith.style.transform = `rotateX(${currentTiltX}deg) rotateY(${currentTiltY}deg)`;
                
                // Sweep Glare opposite to mouse
                glare.style.transform = `translate(${normX * -50}%, ${normY * -50}%)`;
                glare.style.opacity = Math.abs(normX) * 0.3 + Math.abs(normY) * 0.3;
            } else {
                // Reset on mobile
                monolith.style.transform = `rotateX(0deg) rotateY(0deg)`;
                glare.style.opacity = 0;
            }

            // --- C. Butterfly Physics ---
            let wanderX = Math.sin(time * 1.2) * 12;
            let wanderY = Math.cos(time * 1.5) * 12;

            let bdx = (mouseX + wanderX) - bfX;
            let bdy = (mouseY + wanderY) - bfY;
            
            bfX += bdx * 0.06;
            bfY += bdy * 0.06;

            let velocity = Math.sqrt(bdx * bdx + bdy * bdy);
            let targetAngle = Math.atan2(bdy, bdx) * (180 / Math.PI) + 90;
            
            if (velocity > 2) {
                bfAngle = lerpAngle(bfAngle, targetAngle, 0.08);
            }

            let angleDiff = ((targetAngle - bfAngle + 540) % 360) - 180;
            let targetBankY = angleDiff * 0.5 * Math.min(velocity / 10, 1);
            targetBankY = Math.max(-45, Math.min(45, targetBankY)); 
            let targetPitchX = Math.min(velocity * 1.2, 35);

            bfPitchX += (targetPitchX - bfPitchX) * 0.1;
            bfBankY += (targetBankY - bfBankY) * 0.1;

            let altitudeScale = 1 + Math.sin(time * 2.5) * 0.06;

            if (butterfly) {
                butterfly.style.transform = `translate(${bfX}px, ${bfY}px) scale(${altitudeScale}) rotateZ(${bfAngle}deg) rotateX(${bfPitchX}deg) rotateY(${bfBankY}deg)`;

                // Gear-shifting Flap Speed
                let flapState = 'hover';
                let flapSpeed = '0.8s'; 
                if (velocity > 12) {
                    flapState = 'fast';
                    flapSpeed = '0.12s';
                } else if (velocity > 4) {
                    flapState = 'medium';
                    flapSpeed = '0.3s';
                }
                if (flapState !== lastFlapState) {
                    document.documentElement.style.setProperty('--flap-speed', flapSpeed);
                    lastFlapState = flapState;
                }
            }

            requestAnimationFrame(render);
        }
        
        // Start the engine
        render();
    </script>
